<!DOCTYPE html>
<html>
<head>
    <title>Edit Student</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 30px;
        }

        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Edit Student</h1>

    <form method="POST">

        <label>Roll Number</label>
        <input type="text"
               name="roll_no"
               value="{{ student.roll_no }}"
               required>

        <label>PRN Number</label>
        <input type="text"
               name="prn_no"
               value="{{ student.prn_no }}"
               required>

        <label>Student Name</label>
        <input type="text"
               name="name"
               value="{{ student.name }}"
               required>

        <label>Class</label>
        <input type="text"
               name="class_name"
               value="{{ student.class_name }}"
               required>

        <button type="submit">
            Update Student
        </button>

    </form>

    <a href="/students" class="back">
        ← Back to Student Management
    </a>

</div>

</body>
</html>
