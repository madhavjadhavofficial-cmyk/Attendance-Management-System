<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Login | Attendance Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(135deg, #667eea, #764ba2);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 40px 35px;
            border-radius: 20px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);

            text-align: center;
        }

        .logo {
            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: linear-gradient(135deg, #667eea, #764ba2);

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 34px;
            color: white;
        }

        h1 {
            font-size: 26px;
            color: #222;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .teacher-title {
            font-size: 20px;
            color: #444;
            margin-bottom: 25px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #444;
            margin-bottom: 8px;
        }

        .input-box {
            position: relative;
        }

        .input-box span {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);

            font-size: 18px;
        }

        .input-box input {
            width: 100%;
            padding: 13px 15px 13px 45px;

            border: 1px solid #ddd;
            border-radius: 10px;

            outline: none;
            font-size: 15px;

            transition: 0.3s;
        }

        .input-box input:focus {
            border-color: #667eea;

            box-shadow:
                0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .login-btn {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(135deg, #667eea, #764ba2);

            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(102, 126, 234, 0.35);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .footer {
            margin-top: 25px;

            font-size: 12px;
            color: #999;
        }

        @media (max-width: 480px) {

            .login-card {
                padding: 30px 22px;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <!-- Logo -->
            <div class="logo">
                🎓
            </div>

            <!-- Heading -->
            <h1>Attendance Management System</h1>

            <p class="subtitle">
                Manage student attendance easily and efficiently
            </p>

            <h2 class="teacher-title">
                Teacher Login
            </h2>

            <!-- Login Form -->
            <form method="POST" action="/login">

                <!-- Username -->
                <div class="input-group">

                    <label>Username</label>

                    <div class="input-box">

                        <span>👤</span>

                        <input
                            type="text"
                            name="username"
                            placeholder="Enter your username"
                            required
                        >

                    </div>

                </div>


                <!-- Password -->
                <div class="input-group">

                    <label>Password</label>

                    <div class="input-box">

                        <span>🔒</span>

                        <input
                            type="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>

                </div>


                <!-- Login Button -->
                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>


            <!-- Footer -->
            <div class="footer">
                © 2026 Attendance Management System
            </div>

        </div>

    </div>

</body>
</html>
